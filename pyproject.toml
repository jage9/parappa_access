[project]
name = "parappa-access"
version = "0.1.0"
description = "An accessibility mod for Parappa the Rapper on PS1"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "prismatoid==0.18.2",
    "cffi==2.1.1",
    "pycparser==3.0",
    "PyAudioWPatch==0.2.12.8",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
